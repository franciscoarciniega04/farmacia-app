services:
  db:
    image: mysql:8.0
    container_name: farmacia_mysql
    env_file:
      - .env.docker
    ports:
      - "3307:3306"
    volumes:
      - farmacia_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    container_name: farmacia_backend
    env_file:
      - .env.docker
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  farmacia_mysql_data: